services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rpm}
      POSTGRES_USER: ${POSTGRES_USER:-rpm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rpm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: ["5432:5432"]
  backend:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8000:8000"]
volumes:
  postgres_data:
