[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsebridge-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "joblib==1.5.3",
  "matplotlib==3.10.8",
  "numpy==2.4.2",
  "scikit-learn==1.8.0",
]

[project.optional-dependencies]
dev = ["mypy==1.20.2", "pytest==8.4.2", "ruff==0.16.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
