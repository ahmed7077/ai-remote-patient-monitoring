[project]
name = "rpm-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.0", "argon2-cffi==25.1.0", "fastapi==0.141.1",
  "psycopg[binary]==3.3.6", "pydantic==2.13.5", "pydantic-settings==2.15.0",
  "pyjwt==2.14.0", "sqlalchemy==2.0.54", "uvicorn[standard]==0.53.0",
  "email-validator==2.3.0"
]
[project.optional-dependencies]
dev = ["httpx==0.28.1", "mypy==1.20.2", "pytest==8.4.2", "ruff==0.16.8"]
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*"]
namespaces = false
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
