[project]
name = "rpm-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2", "argon2-cffi>=23,<26", "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.6,<3",
  "pyjwt>=2.9,<3", "sqlalchemy>=2.0,<3", "uvicorn[standard]>=0.32,<1",
  "email-validator>=2.2,<3"
]
[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "mypy>=1.13,<2", "pytest>=8,<9", "ruff>=0.8,<1"]
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*"]
namespaces = false
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
